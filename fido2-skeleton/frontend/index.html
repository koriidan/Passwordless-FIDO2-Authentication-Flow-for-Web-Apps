<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>FIDO2 Passwordless Login</title>
  <link rel="stylesheet" href="css/style.css">
</head>

<body>
  <!-- Frontend team: replace this stub with the real UI.
       See README.md and ../API_CONTRACT.md. -->
  <main class ="login-container">

    <div class ="logo" aria-hidden="true">
      <span>🔒</span>
    </div>

    <p class="subtitle">
      Sign in securely without a password.
    </p>

    <form id ="loginForm">
      <div class="input-group">
        <label for="username">Username</label>
        <input type="text" id="username" name="username" placeholder="Enter your username" required>
      </div>

      <button type="submit" class="primary-btn">
                Sign in with Passkey
      </button>

    </form>

    <p class="divider">OR</p>

    <a href="push.html" class="secondary-button" id="pushLogin">
      Sign in with Push Notification
    </a>
    
    <button type="button" class="secondary-btn" id="totpLogin">
    Sign in with Authentication Code
    </button>

    <div id="totpSection" hidden>
        <label for="totpCode">6-Digit Authentication Code</label>

        <input
            type="text"
            id="totpCode"
            name="totpCode"
            inputmode="numeric"
            pattern="[0-9]{6}"
            maxlength="6"
            autocomplete="one-time-code"
            placeholder="Enter 6-digit code"
        >

        <button type="button" class="primary-btn" id="verifyTotp">
            Verify Code
        </button>
    </div>

    <p id="message" role="status" aria-live="polite"></p>
    
    <p class="register-text"> 
      Dont have an account?
      <a href="register.html" id="registerLink">Register here</a>
    </p>
  </main>
<script type="module" src="js/app.js"></script>
</body>
</html>
