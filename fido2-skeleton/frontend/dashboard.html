
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Account Dashboard</title>

    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/dashboard.css">
</head>

<body class="dashboard-page">
    <main class="dashboard-container">
        <div class="logo">🔐</div>

        <h1>Account Dashboard</h1>
        <p class="subtitle">
            Passwordless Authentication System
        </p>

        <section class="dashboard-section">
            <h2>Account Information</h2>

            <p>
                Signed in as:
                <strong id="username">Loading...</strong>
            </p>

            <p>
                Login method:
                <strong id="method">Loading...</strong>
            </p>
        </section>

        <section class="dashboard-section">
            <h2>Registered Passkeys</h2>

            <ul id="deviceList">
                <li>Loading registered passkeys...</li>
            </ul>

            <p id="deviceMessage"></p>
        </section>

        <section class="dashboard-section">
            <h2>Recent Sign-in Attempts</h2>

            <table>
                <thead>
                    <tr>
                        <th>Time</th>
                        <th>Method</th>
                        <th>Result</th>
                    </tr>
                </thead>

                <tbody id="auditRows"></tbody>
            </table>

            <p id="auditMessage"></p>
        </section>

        <button id="logoutButton" class="primary-btn">
            Log Out
        </button>
    </main>

    <script type="module" src="./js/dashboard.js"></script>
</body>
</html>
